name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.6"
          elixir-version: "1.20.4"
      - run: mix deps.get --check-locked
      - run: mix precommit

  packaging-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
